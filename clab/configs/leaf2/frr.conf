frr defaults datacenter
hostname leaf2

interface lo
 ip address 10.255.0.12/32

interface eth1
 description "TO_SPINE1_ETH2"
 ip address 10.0.0.3/31

interface eth2
 description "TO_SPINE2_ETH2"
 ip address 10.0.0.7/31

interface eth3
 description "TO_WORKER2_ETH1"
 ip address 10.1.2.1/24

router bgp 65012
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 description spine1
 neighbor 10.0.0.6 remote-as 65002
 neighbor 10.0.0.6 description spine2
 neighbor 10.1.2.10 remote-as 65222
 neighbor 10.1.2.10 description worker2
 !
 address-family ipv4 unicast
  network 10.255.0.12/32
  network 10.1.2.0/24
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.6 activate
  neighbor 10.1.2.10 activate
  neighbor 10.0.0.2 route-map eBGP_SPINE_OUT out
  neighbor 10.0.0.6 route-map eBGP_SPINE_OUT out
 exit-address-family
!
bgp as-path access-list LOCAL_AS seq 5 permit ^$
bgp as-path access-list LOCAL_AS seq 10 permit ^65222$
!
route-map eBGP_SPINE_OUT permit 10
 match as-path LOCAL_AS
