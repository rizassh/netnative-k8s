apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netshoot-daemonset
  namespace: netlab
  labels:
    app: netshoot
spec:
  selector:
    matchLabels:
      app: netshoot
  template:
    metadata:
     labels:
       app: netshoot
    spec:
      containers:
      - name: netshoot
        image: nicolaka/netshoot:v0.16
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
